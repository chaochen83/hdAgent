<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Makerfabs AI 助手</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: dark;
        --bg-app: #212121;
        --bg-sidebar: #171717;
        --bg-panel: #212121;
        --bg-surface: #2f2f2f;
        --bg-surface-soft: #292929;
        --bg-hover: #343541;
        --border: rgba(255, 255, 255, 0.08);
        --border-strong: rgba(255, 255, 255, 0.12);
        --text: #ececec;
        --text-soft: #a6a6a6;
        --text-muted: #8b8b8b;
        --accent: #10a37f;
        --accent-hover: #0d8c6d;
        --error: #ff6b6b;
        --shadow: 0 18px 60px rgba(0, 0, 0, 0.24);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.04), transparent 28%),
          linear-gradient(180deg, #202123 0%, #1c1c1c 100%);
        color: var(--text);
        min-height: 100vh;
        overflow: hidden;
      }

      .shell {
        width: 100vw;
        height: 100vh;
        display: flex;
        background: var(--bg-app);
      }

      .sidebar {
        width: 280px;
        padding: 16px 14px;
        border-right: 1px solid var(--border);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent 24%),
          var(--bg-sidebar);
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .logo-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border);
      }

      .logo {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: linear-gradient(135deg, #10a37f, #0d8c6d);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 15px;
        font-weight: 700;
      }

      .logo::after {
        content: "M";
      }

      .logo-text-main {
        font-weight: 600;
        font-size: 15px;
      }

      .logo-text-sub {
        margin-top: 2px;
        font-size: 12px;
        color: var(--text-muted);
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border);
        font-size: 11px;
        color: var(--text-soft);
        width: fit-content;
      }

      .pill-dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: radial-gradient(circle, #22c55e, #16a34a);
      }

      .select-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border);
      }

      .label {
        font-size: 12px;
        color: var(--text-soft);
      }

      select {
        width: 100%;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--border-strong);
        background: var(--bg-surface-soft);
        color: var(--text);
        font-size: 13px;
        outline: none;
        appearance: none;
      }

      select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(16, 163, 127, 0.16);
      }

      .hint-card {
        padding: 14px 12px;
        border-radius: 14px;
        background: linear-gradient(180deg, rgba(16, 163, 127, 0.12), rgba(255, 255, 255, 0.03));
        border: 1px solid rgba(16, 163, 127, 0.28);
        font-size: 12px;
        color: var(--text-soft);
        line-height: 1.55;
      }

      .hint-card strong {
        color: var(--accent);
      }

      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.015), transparent 22%),
          var(--bg-panel);
      }

      .chat-window {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .chat-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 24px;
        border-bottom: 1px solid var(--border);
        font-size: 13px;
        color: var(--text-soft);
        background: rgba(255, 255, 255, 0.015);
      }

      .messages {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-size: 15px;
        min-height: 0;
        padding: 18px 0 28px;
      }

      .msg-row {
        display: flex;
        gap: 14px;
        align-items: flex-start;
        width: 100%;
        padding: 18px 24px;
      }

      .msg-row.assistant {
        background: transparent;
      }

      .msg-row.user {
        background: rgba(255, 255, 255, 0.02);
      }

      .msg-avatar {
        width: 30px;
        height: 30px;
        flex: 0 0 30px;
        border-radius: 8px;
        background: #19a37f;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
        color: white;
      }

      .msg-avatar.user {
        background: #3a3a3a;
      }

      .msg-bubble {
        flex: 1;
        max-width: 860px;
        padding: 0;
        background: transparent;
        border: none;
        word-wrap: break-word;
        line-height: 1.7;
      }

      .msg-bubble.assistant {
        background: transparent;
        border-color: transparent;
      }

      .msg-role {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-soft);
        margin-bottom: 8px;
      }

      .composer-wrap {
        padding: 0 24px 22px;
      }

      .input-row {
        display: flex;
        max-width: 860px;
        margin: 0 auto;
      }

      .input-shell {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        border-radius: 24px;
        padding: 12px 14px 12px 18px;
        background: var(--bg-surface);
        border: 1px solid var(--border-strong);
        box-shadow: var(--shadow);
      }

      .input-shell input {
        border: none;
        outline: none;
        flex: 1;
        background: transparent;
        color: var(--text);
        font-size: 15px;
        line-height: 1.4;
      }

      .input-shell input::placeholder {
        color: var(--text-muted);
      }

      button {
        border: none;
        outline: none;
        cursor: pointer;
        font-size: 13px;
        transition: background-color 0.18s ease, border-color 0.18s ease, opacity 0.18s ease,
          transform 0.18s ease;
      }

      .btn-primary {
        width: 36px;
        height: 36px;
        flex: 0 0 36px;
        justify-content: center;
        border-radius: 999px;
        background: var(--accent);
        color: white;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 0;
      }

      .btn-primary.streaming {
        background: #3a3a3a;
      }

      .btn-primary:hover:not(:disabled) {
        background: var(--accent-hover);
      }

      .btn-primary.streaming:hover:not(:disabled) {
        background: #4a4a4a;
      }

      .btn-primary:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .status-text {
        font-size: 12px;
        color: var(--text-soft);
      }

      .error {
        color: var(--error);
        font-size: 13px;
        max-width: 860px;
        margin: 0 auto 10px;
      }

      .typing {
        display: inline-flex;
        gap: 4px;
        align-items: center;
        margin-top: 2px;
      }

      .typing-dot {
        width: 4px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.72);
        animation: pulse 1s infinite ease-in-out;
      }

      .typing-dot:nth-child(2) {
        animation-delay: 0.15s;
      }
      .typing-dot:nth-child(3) {
        animation-delay: 0.3s;
      }

      .code-block {
        position: relative;
        margin-top: 12px;
        border-radius: 18px;
        background: #111111;
        border: 1px solid rgba(255, 255, 255, 0.08);
        overflow: hidden;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.24);
      }

      .code-block-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 14px;
        font-size: 12px;
        color: var(--text-soft);
        background: #1a1a1a;
        border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      }

      .code-header-left {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      .code-header-dots {
        display: inline-flex;
        gap: 6px;
      }

      .code-header-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
      }

      .code-lang-badge {
        padding: 4px 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: #d4d4d4;
        text-transform: lowercase;
      }

      .code-copy-btn {
        border-radius: 999px;
        padding: 5px 10px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.03);
        color: var(--text-soft);
        font-size: 11px;
        cursor: pointer;
      }

      .code-copy-btn:hover {
        background: rgba(255, 255, 255, 0.07);
      }

      .code-copy-btn:active {
        transform: translateY(1px);
      }

      .code-body {
        display: grid;
        grid-template-columns: auto 1fr;
      }

      .code-line-numbers {
        margin: 0;
        padding: 14px 0 14px 14px;
        min-width: 46px;
        background: rgba(255, 255, 255, 0.02);
        border-right: 1px solid rgba(255, 255, 255, 0.06);
        color: #6f6f6f;
        text-align: right;
        user-select: none;
      }

      .code-line-numbers span {
        display: block;
        padding-right: 10px;
        line-height: 1.6;
      }

      .code-block pre {
        margin: 0;
        padding: 14px 16px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New",
          monospace;
        font-size: 13px;
        overflow-x: auto;
        white-space: pre;
        line-height: 1.6;
      }

      .assistant-text a {
        color: var(--accent);
        text-decoration: none;
      }

      .assistant-text a:hover {
        text-decoration: underline;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.2;
          transform: translateY(0px);
        }
        50% {
          opacity: 1;
          transform: translateY(-1px);
        }
      }

      @media (max-width: 880px) {
        .shell {
          flex-direction: column;
        }
        .sidebar {
          width: 100%;
          border-right: none;
          border-bottom: 1px solid var(--border);
          padding: 12px;
        }
        .sidebar-col {
          display: flex;
          flex-direction: column;
          gap: 10px;
        }
        .chat-header,
        .msg-row,
        .composer-wrap {
          padding-left: 14px;
          padding-right: 14px;
        }
        .msg-avatar {
          width: 28px;
          height: 28px;
          flex-basis: 28px;
        }
      }

      @media (max-width: 640px) {
        .pill {
          width: 100%;
          justify-content: center;
        }
        .logo-row {
          width: 100%;
        }
        .sidebar {
          gap: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="sidebar-col">
          <div class="logo-row">
            <div class="logo"></div>
            <div>
              <div class="logo-text-main">Makerfabs AI</div>
              <div class="logo-text-sub">Hardware code copilot</div>
            </div>
          </div>
          <div class="pill">
            <span class="pill-dot"></span>
            <span>流式回复已开启</span>
          </div>
        </div>
        <div class="sidebar-col">
          <div class="select-group">
            <label class="label" for="productSelect">目标产品型号</label>
            <select id="productSelect">
              <option value="" selected>请先确认产品型号</option>
            </select>
          </div>
          <div class="select-group">
            <label class="label" for="providerSelect">大模型提供方</label>
            <select id="providerSelect">
              <option value="qwen">阿里 Qwen</option>
              <option value="deepseek">DeepSeek</option>
              <option value="openai" selected>OpenAI (ChatGPT)</option>
              <option value="claude">Anthropic Claude</option>
            </select>
          </div>
          <div class="hint-card">
            <strong>提示</strong><br />
            后端会根据型号自动加入板级配置，例如 ESP32-S3-WROOM-1 的 I2C 引脚说明。
          </div>
        </div>
      </aside>
      <main class="main">
        <div class="chat-window">
          <div class="chat-header">
            <div>Makerfabs Assistant</div>
            <div class="status-text" id="statusText">就绪</div>
          </div>
          <div class="messages" id="messages"></div>
          <div id="errorBox" class="error" style="display: none"></div>
          <div class="composer-wrap">
            <div class="input-row">
              <div class="input-shell">
                <input
                  id="userInput"
                  placeholder="给 Makerfabs 板卡描述你的需求，比如：帮我写一个触摸屏笑脸示例"
                />
                <button id="sendBtn" class="btn-primary" aria-label="发送">
                  <span id="sendLabel">↑</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script>
      const messagesEl = document.getElementById("messages");
      const userInputEl = document.getElementById("userInput");
      const sendBtn = document.getElementById("sendBtn");
      const sendLabel = document.getElementById("sendLabel");
      const statusText = document.getElementById("statusText");
      const errorBox = document.getElementById("errorBox");
      const productSelect = document.getElementById("productSelect");
      const providerSelect = document.getElementById("providerSelect");

      function updateComposerButton() {
        const hasText = userInputEl.value.trim().length > 0;
        const isStreaming = !!currentSource;
        sendBtn.disabled = !isStreaming && !hasText;
        sendBtn.classList.toggle("streaming", isStreaming);
        sendBtn.setAttribute("aria-label", isStreaming ? "停止生成" : "发送");
        sendLabel.textContent = isStreaming ? "■" : "↑";
      }

      function updateSendEnabled() {
        updateComposerButton();
      }

      /** 会话上下文，发送给后端 */
      const conversation = [];

      /** 当前 SSE 连接，用于“暂停” */
      let currentSource = null;
      let currentAssistantBuffer = "";
      let currentAssistantNode = null;
      // 全局会话参数：当前产品型号（优先用新 key，兼容旧 key）
      let current_product_model = localStorage.getItem("current_product_model") || null;

      // 如果缓存里已有设备，也同步到下拉框（不影响后端逻辑）
      if (current_product_model) {
        productSelect.value = current_product_model;
      }

      productSelect.addEventListener("change", () => {
        const selected = (productSelect.value || "").trim();
        current_product_model = selected || null;
        if (current_product_model) {
          localStorage.setItem("current_product_model", current_product_model);
        } else {
          localStorage.removeItem("current_product_model");
        }
      });

      function appendMessage(role, content) {
        const row = document.createElement("div");
        row.className = "msg-row " + role;

        const avatar = document.createElement("div");
        avatar.className = "msg-avatar " + (role === "user" ? "user" : "assistant");
        avatar.textContent = role === "user" ? "U" : "M";

        const bubble = document.createElement("div");
        bubble.className = "msg-bubble " + (role === "assistant" ? "assistant" : "");

        const roleLabel = document.createElement("div");
        roleLabel.className = "msg-role";
        roleLabel.textContent = role === "user" ? "你" : "Makerfabs AI";

        const contentDiv = document.createElement("div");
        renderContent(role, contentDiv, content);

        bubble.appendChild(roleLabel);
        bubble.appendChild(contentDiv);

        row.appendChild(avatar);
        row.appendChild(bubble);

        messagesEl.appendChild(row);
        messagesEl.scrollTop = messagesEl.scrollHeight;

        return contentDiv;
      }

      function renderContent(role, el, text) {
        if (role !== "assistant") {
          el.textContent = text;
          return;
        }

        el.innerHTML = "";

        const blocks = parseBlocks(text);

        blocks.forEach((block, blockIdx) => {
          if (block.type === "code") {
            const wrapper = document.createElement("div");
            wrapper.className = "code-block";

            const header = document.createElement("div");
            header.className = "code-block-header";

            const headerLeft = document.createElement("div");
            headerLeft.className = "code-header-left";

            const dots = document.createElement("div");
            dots.className = "code-header-dots";
            for (let i = 0; i < 3; i++) {
              const dot = document.createElement("span");
              dot.className = "code-header-dot";
              dots.appendChild(dot);
            }

            const langBadge = document.createElement("span");
            langBadge.className = "code-lang-badge";
            langBadge.textContent = detectCodeLanguage(block.text, block.lang);

            headerLeft.appendChild(dots);
            headerLeft.appendChild(langBadge);
            header.appendChild(headerLeft);

            // 每段代码块都有独立按钮
            const btn = document.createElement("button");
            btn.className = "code-copy-btn";
            btn.textContent = "复制全部代码";
            btn.addEventListener("click", async () => {
              try {
                await navigator.clipboard.writeText(block.text);
                btn.textContent = "已复制";
                setTimeout(() => (btn.textContent = "复制全部代码"), 1500);
              } catch {
                btn.textContent = "复制失败";
                setTimeout(() => (btn.textContent = "复制全部代码"), 1500);
              }
            });
            header.appendChild(btn);

            const codeBody = document.createElement("div");
            codeBody.className = "code-body";

            const lineNumbers = document.createElement("div");
            lineNumbers.className = "code-line-numbers";
            const lines = block.text.split("\n");
            lines.forEach((_, index) => {
              const lineNo = document.createElement("span");
              lineNo.textContent = String(index + 1);
              lineNumbers.appendChild(lineNo);
            });

            const pre = document.createElement("pre");
            const code = document.createElement("code");
            code.textContent = block.text;
            pre.appendChild(code);

            wrapper.appendChild(header);
            codeBody.appendChild(lineNumbers);
            codeBody.appendChild(pre);
            wrapper.appendChild(codeBody);
            el.appendChild(wrapper);
          } else {
            const textContainer = document.createElement("div");
            textContainer.className = "assistant-text";

            const paragraphs = block.text.split(/\n{2,}/);
            paragraphs.forEach((pText) => {
              const trimmed = pText.trimEnd();
              if (!trimmed.trim()) return;

              const p = document.createElement("p");
              p.style.margin = "6px 0 0";

              const lines = pText.split("\n");
              lines.forEach((line, i) => {
                renderInlineMarkdown(p, line);
                if (i < lines.length - 1) p.appendChild(document.createElement("br"));
              });

              textContainer.appendChild(p);
            });

            el.appendChild(textContainer);
          }
        });
      }

      function parseBlocks(text) {
        const blocks = [];
        // 支持 ```cpp ... ``` 以及不带语言标记的 ``` ... ```
        const regex = /```(\w+)?\s*([\s\S]*?)```/g;
        let lastIndex = 0;
        let m;
        while ((m = regex.exec(text)) !== null) {
          if (m.index > lastIndex) {
            blocks.push({ type: "text", text: text.slice(lastIndex, m.index) });
          }
          blocks.push({ type: "code", lang: (m[1] || "").trim(), text: (m[2] || "").trimEnd() });
          lastIndex = regex.lastIndex;
        }
        if (lastIndex < text.length) {
          blocks.push({ type: "text", text: text.slice(lastIndex) });
        }
        return blocks;
      }

      function detectCodeLanguage(codeText, declaredLang) {
        const lang = (declaredLang || "").trim().toLowerCase();
        if (lang) return lang;

        const sample = codeText || "";
        if (
          /#include\s*<[^>]+>/.test(sample) ||
          /\bvoid\s+setup\s*\(/.test(sample) ||
          /\bvoid\s+loop\s*\(/.test(sample) ||
          /Arduino_[A-Za-z0-9_]+/.test(sample)
        ) {
          return "cpp";
        }
        return "code";
      }

      // 一个轻量的“类 Markdown”行内渲染：支持 **加粗**、`行内代码`、[文字](链接)
      function renderInlineMarkdown(containerEl, line) {
        let i = 0;
        const s = line;
        const patterns = [
          { type: "link", re: /\[([^\]]+)\]\(([^)]+)\)/ },
          { type: "bold", re: /\*\*([^*]+)\*\*/ },
          { type: "code", re: /`([^`]+)`/ },
        ];

        while (i < s.length) {
          let best = null; // {type, start, end, groups}

          for (const p of patterns) {
            const sub = s.slice(i);
            const m = p.re.exec(sub);
            if (!m) continue;
            const start = i + (m.index || 0);
            const end = start + m[0].length;
            if (!best || start < best.start) {
              best = { type: p.type, start, end, groups: m.slice(1) };
            }
          }

          if (!best) {
            containerEl.appendChild(document.createTextNode(s.slice(i)));
            break;
          }

          if (best.start > i) {
            containerEl.appendChild(document.createTextNode(s.slice(i, best.start)));
          }

          if (best.type === "bold") {
            const strong = document.createElement("strong");
            strong.textContent = best.groups[0];
            containerEl.appendChild(strong);
          } else if (best.type === "code") {
            const code = document.createElement("code");
            code.textContent = best.groups[0];
            code.style.background = "rgba(255, 255, 255, 0.05)";
            code.style.border = "1px solid rgba(255, 255, 255, 0.08)";
            code.style.padding = "0 6px";
            code.style.borderRadius = "8px";
            containerEl.appendChild(code);
          } else if (best.type === "link") {
            const a = document.createElement("a");
            a.href = best.groups[1];
            a.target = "_blank";
            a.rel = "noreferrer noopener";
            a.textContent = best.groups[0];
            containerEl.appendChild(a);
          }

          i = best.end;
        }
      }

      function showTyping() {
        statusText.textContent = "正在思考中…";
      }

      function hideTyping() {
        statusText.textContent = "就绪";
      }

      function setError(text) {
        if (text) {
          errorBox.style.display = "block";
          errorBox.textContent = text;
        } else {
          errorBox.style.display = "none";
          errorBox.textContent = "";
        }
      }

      function setStreaming(isStreaming) {
        updateComposerButton();
      }

      function initConversation() {
        const initialUser =
          "你好，欢迎进入 Makerfabs AI， 你需要问关于那个产品的问题呢？";
        appendMessage("assistant", initialUser);

        conversation.push(
          { role: "assistant", content: initialUser },
        );
      }

      async function sendMessage() {
        const text = userInputEl.value.trim();
        if (!text || currentSource) return;

        setError("");

        conversation.push({ role: "user", content: text });
        appendMessage("user", text);
        userInputEl.value = "";

        currentAssistantBuffer = "";
        const contentNode = appendMessage("assistant", "");
        currentAssistantNode = contentNode;

        showTyping();
        setStreaming(true);

        const payload = {
          messages: conversation,
          current_product_model: (productSelect.value || "").trim() || current_product_model || null,
          provider: providerSelect.value,
        };

        // 如果后端不和前端同一个端口，可以在这里改成完整地址
        // 例如：const url = "http://localhost:8848/chat/stream";
        // 现在根据当前页面 origin 自动拼接端口，方便你直接改用 8848 等端口。
        const API_BASE = window.location.origin.replace(/\/$/, "");
        const url = API_BASE + "/chat/stream";

        const es = new EventSourcePolyfill(url, {
          headers: {
            "Content-Type": "application/json",
          },
          payload: JSON.stringify(payload),
        });

        currentSource = es;
        updateComposerButton();

        // 后端推送“已确定产品型号”，前端缓存用于下次对话
        es.addEventListener("product_model", (ev) => {
          const d = (ev.data || "").trim();
          if (!d) return;
          current_product_model = d;
          localStorage.setItem("current_product_model", d);
          // 尽量同步到下拉框（如果选项存在）
          if (Array.from(productSelect.options).some((o) => o.value === d)) {
            productSelect.value = d;
          }
        });

        es.addEventListener("token", (ev) => {
          const chunk = ev.data;
          console.log("[stream token]", chunk);
          currentAssistantBuffer += chunk;
          if (currentAssistantNode) {
            renderContent("assistant", currentAssistantNode, currentAssistantBuffer);
          }
          messagesEl.scrollTop = messagesEl.scrollHeight;
        });

        es.addEventListener("end", () => {
          console.log("[stream end]");
          cleanupStream();
        });

        es.addEventListener("error", (ev) => {
          console.error("[server stream error]", ev.data);
          setError("服务器错误（" + ev.data + "）");
          cleanupStream();
        });

        es.onerror = (e) => {
          console.error("[stream error]", e);
          setError("流式连接出错或已中断。");
          cleanupStream();
        };
      }

      function cleanupStream() {
        hideTyping();
        if (currentSource) {
          currentSource.close();
          currentSource = null;
        }
        setStreaming(false);
        if (currentAssistantBuffer) {
          conversation.push({ role: "assistant", content: currentAssistantBuffer });
        }
        currentAssistantBuffer = "";
        currentAssistantNode = null;
        updateSendEnabled();
      }

      // 簇流式 POST + SSE Polyfill 封装
      class EventSourcePolyfill {
        constructor(url, { headers, payload }) {
          this.url = url;
          this.headers = headers || {};
          this.payload = payload || null;
          this.listeners = {};
          this.controller = new AbortController();
          this._start();
        }

        _emit(type, event) {
          (this.listeners[type] || []).forEach((cb) => cb(event));
        }

        addEventListener(type, callback) {
          if (!this.listeners[type]) this.listeners[type] = [];
          this.listeners[type].push(callback);
        }

        close() {
          this.controller.abort();
        }

        async _start() {
          try {
            const res = await fetch(this.url, {
              method: "POST",
              headers: this.headers,
              body: this.payload,
              signal: this.controller.signal,
            });

            if (!res.ok || !res.body) {
              this._emit("error", new Event("error"));
              return;
            }

            const reader = res.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let buffer = "";

            while (true) {
              const { value, done } = await reader.read();
              if (done) break;
              buffer += decoder.decode(value, { stream: true });
              buffer = buffer.replace(/\r\n/g, "\n");

              let cut;
              while ((cut = buffer.indexOf("\n\n")) !== -1) {
                const rawEvent = buffer.slice(0, cut);
                buffer = buffer.slice(cut + 2);

                if (!rawEvent) continue;

                const lines = rawEvent.split("\n");
                let eventType = "message";
                const dataLines = [];
                for (const line of lines) {
                  if (line.startsWith("event:")) {
                    eventType = line.slice("event:".length).trim();
                  } else if (line.startsWith("data:")) {
                    let dataPart = line.slice("data:".length);
                    if (dataPart.startsWith(" ")) dataPart = dataPart.slice(1);
                    dataLines.push(dataPart);
                  }
                }
                const data = dataLines.join("\n");
                const ev = { data };
                if (eventType === "message") {
                  this._emit("message", ev);
                } else {
                  this._emit(eventType, ev);
                }
              }
            }

            this._emit("end", new Event("end"));
          } catch (e) {
            if (this.controller.signal.aborted) return;
            this._emit("error", new Event("error"));
          }
        }
      }

      sendBtn.addEventListener("click", () => {
        if (currentSource) {
          currentSource.close();
          cleanupStream();
          return;
        }
        sendMessage();
      });
      userInputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      initConversation();
      loadProductModelList();
      updateSendEnabled();
      userInputEl.addEventListener("input", updateSendEnabled);

      async function loadProductModelList() {
        try {
          const API_BASE = window.location.origin.replace(/\/$/, "");
          const res = await fetch(API_BASE + "/product-model-list");
          if (!res.ok) return;
          const data = await res.json();
          const list = Array.isArray(data.product_model_list) ? data.product_model_list : [];
          const defaultOption = productSelect.querySelector("option[value='']");
          productSelect.innerHTML = "";
          if (defaultOption) {
            productSelect.appendChild(defaultOption);
          } else {
            const opt = document.createElement("option");
            opt.value = "";
            opt.textContent = "请先确认产品型号";
            productSelect.appendChild(opt);
          }
          list.forEach((model) => {
            const opt = document.createElement("option");
            opt.value = model;
            opt.textContent = model;
            productSelect.appendChild(opt);
          });
          if (current_product_model && list.includes(current_product_model)) {
            productSelect.value = current_product_model;
          } else {
            productSelect.value = "";
          }
        } catch {
          // keep static fallback option only
        }
      }
    </script>
  </body>
  </html>
