<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Makerfabs AI 助手</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --bg-elevated: #020617;
        --accent: #38bdf8;
        --accent-soft: rgba(56, 189, 248, 0.1);
        --border: #1e293b;
        --text: #e5e7eb;
        --text-soft: #9ca3af;
        --error: #f97373;
        --radius-lg: 16px;
        --radius-md: 999px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        background: radial-gradient(circle at top, #0f172a 0, #020617 45%, #000 100%);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 16px 0;
      }

      .shell {
        width: min(1120px, 100vw - 32px);
        height: calc(100vh - 32px);   /* ✅ 改这里：固定高度 */
        max-height: none;             /* ❌ 去掉 max-height */
        background: linear-gradient(145deg, rgba(15, 23, 42, 0.96), rgba(15, 23, 42, 0.98));
        border-radius: 32px;
        border: 1px solid rgba(148, 163, 184, 0.2);
        box-shadow:
          0 40px 120px rgba(15, 23, 42, 0.8),
          0 0 0 1px rgba(15, 23, 42, 0.9);
        display: flex;
        overflow: hidden;
      }

      .sidebar {
        width: 260px;
        padding: 24px 20px;
        border-right: 1px solid var(--border);
        background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.15), transparent 60%);
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .logo-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .logo {
        width: 32px;
        height: 32px;
        border-radius: 14px;
        background: conic-gradient(from 180deg, #22d3ee, #a855f7, #f97316, #22d3ee);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.9);
      }

      .logo::after {
        content: "";
        width: 22px;
        height: 22px;
        border-radius: 10px;
        background: radial-gradient(circle at 30% 10%, #0ea5e9, #0f172a 60%);
      }

      .logo-text-main {
        font-weight: 600;
        letter-spacing: 0.03em;
        font-size: 15px;
      }

      .logo-text-sub {
        font-size: 11px;
        color: var(--text-soft);
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: var(--radius-md);
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.35);
        font-size: 11px;
        color: var(--text-soft);
        width: fit-content;
      }

      .pill-dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: radial-gradient(circle, #22c55e, #16a34a);
      }

      .select-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .label {
        font-size: 12px;
        color: var(--text-soft);
      }

      select {
        width: 100%;
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid rgba(148, 163, 184, 0.5);
        background: rgba(15, 23, 42, 0.9);
        color: var(--text);
        font-size: 13px;
        outline: none;
      }

      select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.5);
      }

      .hint-card {
        margin-top: 10px;
        padding: 10px 12px;
        border-radius: 14px;
        background: radial-gradient(circle at 0 0, var(--accent-soft), rgba(15, 23, 42, 0.9));
        border: 1px solid rgba(56, 189, 248, 0.4);
        font-size: 12px;
        color: var(--text-soft);
      }

      .hint-card strong {
        color: var(--accent);
      }

      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 18px 18px 16px;
        gap: 10px;
        min-height: 0;   /* 🔥 关键：允许子元素滚动 */
      }

      .chat-window {
        flex: 1;
        border-radius: 20px;
        border: 1px solid rgba(15, 23, 42, 0.9);
        background:
          radial-gradient(circle at 0 0, rgba(56, 189, 248, 0.14), transparent 60%),
          radial-gradient(circle at 80% 0, rgba(147, 51, 234, 0.16), transparent 55%),
          #020617;
        position: relative;
        padding: 16px 16px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 0;   /* 🔥 关键 */
      }

      .chat-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        color: var(--text-soft);
        margin-bottom: 4px;
      }

      .messages {
        flex: 1;
        overflow-y: auto;
        padding-right: 4px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 14px;
        min-height: 0;   /* 🔥 关键 */
      }

      .msg-row {
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }

      .msg-avatar {
        width: 22px;
        height: 22px;
        border-radius: 999px;
        background: radial-gradient(circle at 30% 20%, #22d3ee, #0f172a);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
      }

      .msg-avatar.user {
        background: radial-gradient(circle at 30% 20%, #f97316, #111827);
      }

      .msg-bubble {
        max-width: 100%;
        padding: 10px 12px;
        border-radius: 16px;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.4);
        word-wrap: break-word;
        line-height: 1.55;
      }

      .msg-bubble.assistant {
        background: rgba(15, 23, 42, 0.96);
        border-color: rgba(56, 189, 248, 0.5);
      }

      .msg-role {
        font-size: 11px;
        color: var(--text-soft);
        margin-bottom: 2px;
      }

      .input-row {
        margin-top: 6px;
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .input-shell {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        border-radius: 999px;
        padding: 4px 10px 4px 12px;
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid rgba(148, 163, 184, 0.5);
      }

      .input-shell input {
        border: none;
        outline: none;
        flex: 1;
        background: transparent;
        color: var(--text);
        font-size: 13px;
      }

      .input-shell input::placeholder {
        color: rgba(148, 163, 184, 0.7);
      }

      button {
        border: none;
        outline: none;
        cursor: pointer;
        font-size: 12px;
      }

      .btn-primary {
        padding: 7px 14px;
        border-radius: var(--radius-md);
        background: linear-gradient(135deg, #22d3ee, #38bdf8);
        color: #020617;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        box-shadow: 0 10px 25px rgba(56, 189, 248, 0.35);
      }

      .btn-ghost {
        padding: 6px 12px;
        border-radius: var(--radius-md);
        background: rgba(15, 23, 42, 0.7);
        color: var(--text-soft);
        border: 1px solid rgba(148, 163, 184, 0.4);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .status-text {
        font-size: 11px;
        color: var(--text-soft);
      }

      .error {
        color: var(--error);
        font-size: 12px;
        margin-top: 2px;
      }

      .typing {
        display: inline-flex;
        gap: 4px;
        align-items: center;
        margin-top: 2px;
      }

      .typing-dot {
        width: 4px;
        height: 4px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.8);
        animation: pulse 1s infinite ease-in-out;
      }

      .typing-dot:nth-child(2) {
        animation-delay: 0.15s;
      }
      .typing-dot:nth-child(3) {
        animation-delay: 0.3s;
      }

      .code-block {
        position: relative;
        margin-top: 8px;
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.6);
        overflow: hidden;
      }

      .code-block-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 10px;
        font-size: 11px;
        color: var(--text-soft);
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.98));
        border-bottom: 1px solid rgba(15, 23, 42, 0.9);
      }

      .code-copy-btn {
        border-radius: 999px;
        padding: 3px 8px;
        border: 1px solid rgba(148, 163, 184, 0.6);
        background: rgba(15, 23, 42, 0.9);
        color: var(--text-soft);
        font-size: 11px;
        cursor: pointer;
      }

      .code-copy-btn:active {
        transform: translateY(1px);
      }

      .code-block pre {
        margin: 0;
        padding: 10px 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New",
          monospace;
        font-size: 12px;
        overflow-x: auto;
        white-space: pre;
      }

      .assistant-text a {
        color: var(--accent);
        text-decoration: none;
      }

      .assistant-text a:hover {
        text-decoration: underline;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.2;
          transform: translateY(0px);
        }
        50% {
          opacity: 1;
          transform: translateY(-1px);
        }
      }

      @media (max-width: 880px) {
        .shell {
          flex-direction: column;
          height: 100vh;
          width: 100vw;
          margin: 0;
          border-radius: 0;
        }
        .sidebar {
          width: 100%;
          border-right: none;
          border-bottom: 1px solid var(--border);
          flex-direction: row;
          align-items: center;
          justify-content: space-between;
        }
        .sidebar-col {
          display: flex;
          flex-direction: column;
          gap: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="sidebar-col">
          <div class="logo-row">
            <div class="logo"></div>
            <div>
              <div class="logo-text-main">Makerfabs AI</div>
              <div class="logo-text-sub">Embedded code copilot</div>
            </div>
          </div>
          <div class="pill">
            <span class="pill-dot"></span>
            <span>流式输出 · 可随时暂停</span>
          </div>
        </div>
        <div class="sidebar-col">
          <div class="select-group">
            <label class="label" for="productSelect">目标产品型号</label>
            <select id="productSelect">
              <option value="MaTouch_ESP32S3" selected>MaTouch_ESP32S3</option>
              <option value="ESP32-S3-WROOM-1">ESP32-S3-WROOM-1</option>
              <option value="">其他（通用回答）</option>
            </select>
          </div>
          <div class="select-group">
            <label class="label" for="providerSelect">大模型提供方</label>
            <select id="providerSelect">
              <option value="qwen" selected>阿里 Qwen</option>
              <option value="openai">OpenAI (ChatGPT)</option>
              <option value="claude">Anthropic Claude</option>
            </select>
          </div>
          <div class="hint-card">
            <strong>提示</strong><br />
            后端会根据型号自动加入板级配置，例如 ESP32-S3-WROOM-1 的 I2C 引脚说明。
          </div>
        </div>
      </aside>
      <main class="main">
        <div class="chat-window">
          <div class="chat-header">
            <div>Makerfabs 硬件对话</div>
            <div class="status-text" id="statusText">就绪</div>
          </div>
          <div class="messages" id="messages"></div>
          <div id="errorBox" class="error" style="display: none"></div>
          <div class="input-row">
            <div class="input-shell">
              <input
                id="userInput"
                placeholder="输入你想在板子上实现的功能，比如：我要在这上面做一个笑脸"
              />
            </div>
            <button id="sendBtn" class="btn-primary">
              <span id="sendLabel">发送</span>
              <span>↵</span>
            </button>
            <button id="stopBtn" class="btn-ghost" style="display: none">
              <span>暂停</span>
            </button>
          </div>
        </div>
      </main>
    </div>

    <script>
      const messagesEl = document.getElementById("messages");
      const userInputEl = document.getElementById("userInput");
      const sendBtn = document.getElementById("sendBtn");
      const stopBtn = document.getElementById("stopBtn");
      const statusText = document.getElementById("statusText");
      const errorBox = document.getElementById("errorBox");
      const productSelect = document.getElementById("productSelect");
      const providerSelect = document.getElementById("providerSelect");

      /** 会话上下文，发送给后端 */
      const conversation = [];

      /** 当前 SSE 连接，用于“暂停” */
      let currentSource = null;
      let currentAssistantBuffer = "";
      let currentAssistantNode = null;

      function appendMessage(role, content) {
        const row = document.createElement("div");
        row.className = "msg-row";

        const avatar = document.createElement("div");
        avatar.className = "msg-avatar " + (role === "user" ? "user" : "assistant");
        avatar.textContent = role === "user" ? "U" : "M";

        const bubble = document.createElement("div");
        bubble.className = "msg-bubble " + (role === "assistant" ? "assistant" : "");

        const roleLabel = document.createElement("div");
        roleLabel.className = "msg-role";
        roleLabel.textContent = role === "user" ? "你" : "Makerfabs AI";

        const contentDiv = document.createElement("div");
        renderContent(role, contentDiv, content);

        bubble.appendChild(roleLabel);
        bubble.appendChild(contentDiv);

        row.appendChild(avatar);
        row.appendChild(bubble);

        messagesEl.appendChild(row);
        messagesEl.scrollTop = messagesEl.scrollHeight;

        return contentDiv;
      }

      function renderContent(role, el, text) {
        if (role !== "assistant") {
          el.textContent = text;
          return;
        }

        el.innerHTML = "";

        const blocks = parseBlocks(text);
        const codeBlocks = blocks.filter((b) => b.type === "code");
        const allCode = codeBlocks.map((b) => b.text).join("\n\n").trim();
        const firstCodeIdx = blocks.findIndex((b) => b.type === "code");

        blocks.forEach((block, blockIdx) => {
          if (block.type === "code") {
            const wrapper = document.createElement("div");
            wrapper.className = "code-block";

            const header = document.createElement("div");
            header.className = "code-block-header";
            header.textContent = block.lang ? `代码 (${block.lang})` : "代码";

            if (blockIdx === firstCodeIdx && allCode) {
              const btn = document.createElement("button");
              btn.className = "code-copy-btn";
              btn.textContent = "复制全部代码";
              btn.addEventListener("click", async () => {
                try {
                  await navigator.clipboard.writeText(allCode);
                  btn.textContent = "已复制";
                  setTimeout(() => (btn.textContent = "复制全部代码"), 1500);
                } catch {
                  btn.textContent = "复制失败";
                  setTimeout(() => (btn.textContent = "复制全部代码"), 1500);
                }
              });
              header.appendChild(btn);
            }

            const pre = document.createElement("pre");
            const code = document.createElement("code");
            code.textContent = block.text;
            pre.appendChild(code);

            wrapper.appendChild(header);
            wrapper.appendChild(pre);
            el.appendChild(wrapper);
          } else {
            const textContainer = document.createElement("div");
            textContainer.className = "assistant-text";

            const paragraphs = block.text.split(/\n{2,}/);
            paragraphs.forEach((pText) => {
              const trimmed = pText.trimEnd();
              if (!trimmed.trim()) return;

              const p = document.createElement("p");
              p.style.margin = "6px 0 0";

              const lines = pText.split("\n");
              lines.forEach((line, i) => {
                renderInlineMarkdown(p, line);
                if (i < lines.length - 1) p.appendChild(document.createElement("br"));
              });

              textContainer.appendChild(p);
            });

            el.appendChild(textContainer);
          }
        });
      }

      function parseBlocks(text) {
        const blocks = [];
        // 支持 ```cpp ... ``` 以及不带语言标记的 ``` ... ```
        const regex = /```(\w+)?\s*([\s\S]*?)```/g;
        let lastIndex = 0;
        let m;
        while ((m = regex.exec(text)) !== null) {
          if (m.index > lastIndex) {
            blocks.push({ type: "text", text: text.slice(lastIndex, m.index) });
          }
          blocks.push({ type: "code", lang: (m[1] || "").trim(), text: (m[2] || "").trimEnd() });
          lastIndex = regex.lastIndex;
        }
        if (lastIndex < text.length) {
          blocks.push({ type: "text", text: text.slice(lastIndex) });
        }
        return blocks;
      }

      // 一个轻量的“类 Markdown”行内渲染：支持 **加粗**、`行内代码`、[文字](链接)
      function renderInlineMarkdown(containerEl, line) {
        let i = 0;
        const s = line;
        const patterns = [
          { type: "link", re: /\[([^\]]+)\]\(([^)]+)\)/ },
          { type: "bold", re: /\*\*([^*]+)\*\*/ },
          { type: "code", re: /`([^`]+)`/ },
        ];

        while (i < s.length) {
          let best = null; // {type, start, end, groups}

          for (const p of patterns) {
            const sub = s.slice(i);
            const m = p.re.exec(sub);
            if (!m) continue;
            const start = i + (m.index || 0);
            const end = start + m[0].length;
            if (!best || start < best.start) {
              best = { type: p.type, start, end, groups: m.slice(1) };
            }
          }

          if (!best) {
            containerEl.appendChild(document.createTextNode(s.slice(i)));
            break;
          }

          if (best.start > i) {
            containerEl.appendChild(document.createTextNode(s.slice(i, best.start)));
          }

          if (best.type === "bold") {
            const strong = document.createElement("strong");
            strong.textContent = best.groups[0];
            containerEl.appendChild(strong);
          } else if (best.type === "code") {
            const code = document.createElement("code");
            code.textContent = best.groups[0];
            code.style.background = "rgba(56, 189, 248, 0.12)";
            code.style.border = "1px solid rgba(56, 189, 248, 0.25)";
            code.style.padding = "0 6px";
            code.style.borderRadius = "999px";
            containerEl.appendChild(code);
          } else if (best.type === "link") {
            const a = document.createElement("a");
            a.href = best.groups[1];
            a.target = "_blank";
            a.rel = "noreferrer noopener";
            a.textContent = best.groups[0];
            containerEl.appendChild(a);
          }

          i = best.end;
        }
      }

      function showTyping() {
        statusText.textContent = "正在思考中…";
      }

      function hideTyping() {
        statusText.textContent = "就绪";
      }

      function setError(text) {
        if (text) {
          errorBox.style.display = "block";
          errorBox.textContent = text;
        } else {
          errorBox.style.display = "none";
          errorBox.textContent = "";
        }
      }

      function setStreaming(isStreaming) {
        if (isStreaming) {
          sendBtn.disabled = true;
          stopBtn.style.display = "inline-flex";
        } else {
          sendBtn.disabled = false;
          stopBtn.style.display = "none";
        }
      }

      function initConversation() {
        const initialUser =
          "你好，欢迎进入 Makerfabs AI， 你需要问关于那个产品的问题呢？";
        const initialAssistant =
          "OK，有什么我可以帮助你？例如：\n- MaTouch_ESP32S3：在屏幕上画一个笑脸\n- ESP32-S3-WROOM-1：读取 MPU-6050 数据并通过串口输出\n你可以直接告诉我你用的板子和想要实现的效果。";

        appendMessage("assistant", initialUser);
        appendMessage("assistant", initialAssistant);

        conversation.push(
          { role: "assistant", content: initialUser },
          { role: "assistant", content: initialAssistant },
        );
      }

      async function sendMessage() {
        const text = userInputEl.value.trim();
        if (!text || currentSource) return;

        setError("");

        conversation.push({ role: "user", content: text });
        appendMessage("user", text);
        userInputEl.value = "";

        currentAssistantBuffer = "";
        const contentNode = appendMessage("assistant", "");
        currentAssistantNode = contentNode;

        showTyping();
        setStreaming(true);

        const payload = {
          messages: conversation,
          product_model: productSelect.value || null,
          provider: providerSelect.value,
        };

        // 如果后端不和前端同一个端口，可以在这里改成完整地址
        // 例如：const url = "http://localhost:8848/chat/stream";
        // 现在根据当前页面 origin 自动拼接端口，方便你直接改用 8848 等端口。
        const API_BASE = window.location.origin.replace(/\/$/, "");
        const url = API_BASE + "/chat/stream";

        const es = new EventSourcePolyfill(url, {
          headers: {
            "Content-Type": "application/json",
          },
          payload: JSON.stringify(payload),
        });

        currentSource = es;

        es.addEventListener("token", (ev) => {
          const chunk = ev.data;
          console.log("[stream token]", chunk);
          currentAssistantBuffer += chunk;
          if (currentAssistantNode) {
            renderContent("assistant", currentAssistantNode, currentAssistantBuffer);
          }
          messagesEl.scrollTop = messagesEl.scrollHeight;
        });

        es.addEventListener("end", () => {
          console.log("[stream end]");
          cleanupStream();
        });

        es.onerror = (e) => {
          console.error("[stream error]", e);
          setError("流式连接出错或已中断。");
          cleanupStream();
        };
      }

      function cleanupStream() {
        hideTyping();
        setStreaming(false);
        if (currentSource) {
          currentSource.close();
          currentSource = null;
        }
        if (currentAssistantBuffer) {
          conversation.push({ role: "assistant", content: currentAssistantBuffer });
        }
        currentAssistantBuffer = "";
        currentAssistantNode = null;
      }

      // 簇流式 POST + SSE Polyfill 封装
      class EventSourcePolyfill {
        constructor(url, { headers, payload }) {
          this.url = url;
          this.headers = headers || {};
          this.payload = payload || null;
          this.listeners = {};
          this.controller = new AbortController();
          this._start();
        }

        _emit(type, event) {
          (this.listeners[type] || []).forEach((cb) => cb(event));
        }

        addEventListener(type, callback) {
          if (!this.listeners[type]) this.listeners[type] = [];
          this.listeners[type].push(callback);
        }

        close() {
          this.controller.abort();
        }

        async _start() {
          try {
            const res = await fetch(this.url, {
              method: "POST",
              headers: this.headers,
              body: this.payload,
              signal: this.controller.signal,
            });

            if (!res.ok || !res.body) {
              this._emit("error", new Event("error"));
              return;
            }

            const reader = res.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let buffer = "";

            while (true) {
              const { value, done } = await reader.read();
              if (done) break;
              buffer += decoder.decode(value, { stream: true });

              let cut;
              while ((cut = buffer.indexOf("\n\n")) !== -1) {
                const rawEvent = buffer.slice(0, cut).trim();
                buffer = buffer.slice(cut + 2);

                const lines = rawEvent.split("\n");
                let eventType = "message";
                let data = "";
                for (const line of lines) {
                  if (line.startsWith("event:")) {
                    eventType = line.slice("event:".length).trim();
                  } else if (line.startsWith("data:")) {
                    data += line.slice("data:".length) + "\n";
                  }
                }
                const ev = { data };
                if (eventType === "message") {
                  this._emit("message", ev);
                } else {
                  this._emit(eventType, ev);
                }
              }
            }

            this._emit("end", new Event("end"));
          } catch (e) {
            if (this.controller.signal.aborted) return;
            this._emit("error", new Event("error"));
          }
        }
      }

      sendBtn.addEventListener("click", sendMessage);
      userInputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
      stopBtn.addEventListener("click", () => {
        if (currentSource) {
          currentSource.close();
          cleanupStream();
        }
      });

      initConversation();
    </script>
  </body>
  </html>
