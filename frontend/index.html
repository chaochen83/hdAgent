<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Makerfabs Agent</title>
    <script src="/static/config.js"></script>
    <script>
      const assetVersion = window.__APP_CONFIG__.assetVersion;

      const stylesheet = document.createElement("link");
      stylesheet.rel = "stylesheet";
      stylesheet.href = `/static/styles.css?v=${assetVersion}`;
      document.head.appendChild(stylesheet);
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      const assetVersion = window.__APP_CONFIG__.assetVersion;
      await import(`/static/app.js?v=${assetVersion}`);
    </script>
  </body>
  </html>
